name: Publish container images

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'apps/api/**'
      - 'apps/pwa/**'
      - '.github/workflows/publish-container-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-api:
    name: Publish API image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [[ -f apps/api/Dockerfile ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "apps/api/Dockerfile not found; skipping API image until the stack is selected."
          fi
      - name: Set up Buildx
        if: steps.dockerfile.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.dockerfile.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        if: steps.dockerfile.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push
        if: steps.dockerfile.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  publish-pwa:
    name: Publish PWA image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Dockerfile
        id: dockerfile
        shell: bash
        run: |
          if [[ -f apps/pwa/Dockerfile ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "apps/pwa/Dockerfile not found; skipping PWA image until the stack is selected."
          fi
      - name: Set up Buildx
        if: steps.dockerfile.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: steps.dockerfile.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        if: steps.dockerfile.outputs.available == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-pwa
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
      - name: Build and push
        if: steps.dockerfile.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/pwa
          file: ./apps/pwa/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pwa
          cache-to: type=gha,mode=max,scope=pwa
