name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing GHCR image tag (for example sha-abc1234 or v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy selected image tag
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate inputs and secrets
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_NAMESPACE: ${{ secrets.GHCR_NAMESPACE }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[a-zA-Z0-9._-]+$ ]] || { echo 'Invalid image_tag'; exit 1; }
          for key in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_PATH GHCR_USERNAME GHCR_READ_TOKEN GHCR_NAMESPACE; do
            [[ -n "${!key}" ]] || { echo "Missing secret: $key"; exit 1; }
          done
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo 'DEPLOY_PATH contains unsupported characters'; exit 1; }
          [[ "$DEPLOY_PATH" != *'/../'* && "$DEPLOY_PATH" != */.. ]] || { echo 'DEPLOY_PATH must not traverse parent directories'; exit 1; }
          [[ "$GHCR_NAMESPACE" =~ ^[a-z0-9-]+$ ]] || { echo 'GHCR_NAMESPACE must be lowercase'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]] || { echo 'Invalid DEPLOY_USER'; exit 1; }

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull and restart services
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_NAMESPACE: ${{ secrets.GHCR_NAMESPACE }}
        run: |
          set -euo pipefail
          token_b64="$(printf '%s' "$GHCR_READ_TOKEN" | base64 -w 0)"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$IMAGE_TAG' '$GHCR_NAMESPACE' '$GHCR_USERNAME' '$token_b64'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          deploy_path="$1"
          image_tag="$2"
          ghcr_namespace="$3"
          ghcr_username="$4"
          token_b64="$5"
          ghcr_token="$(printf '%s' "$token_b64" | base64 -d)"
          cd "$deploy_path"
          printf '%s' "$ghcr_token" | docker login ghcr.io -u "$ghcr_username" --password-stdin
          GHCR_NAMESPACE="$ghcr_namespace" IMAGE_TAG="$image_tag" docker compose -f compose.production.yml pull
          GHCR_NAMESPACE="$ghcr_namespace" IMAGE_TAG="$image_tag" docker compose -f compose.production.yml up -d --remove-orphans
          unset ghcr_token
          REMOTE_SCRIPT
